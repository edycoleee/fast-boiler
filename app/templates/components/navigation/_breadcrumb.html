{% set breadcrumb_items = breadcrumb_items | default([]) %}
<nav aria-label="Breadcrumb">
  <ol class="flex flex-wrap items-center gap-2 text-sm text-muted">
    {% for item in breadcrumb_items %}
      <li class="inline-flex items-center gap-2">
        {% if not loop.first %}
          <span aria-hidden="true">/</span>
        {% endif %}
        {% if item.href and not loop.last %}
          <a href="{{ item.href }}" class="hover:text-text">{{ item.label }}</a>
        {% else %}
          <span class="{{ 'font-medium text-text' if loop.last else '' }}">{{ item.label }}</span>
        {% endif %}
      </li>
    {% endfor %}
  </ol>
</nav>
