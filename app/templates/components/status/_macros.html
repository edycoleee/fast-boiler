{% macro render_status_badge(status) -%}
  {% set status_value = (status | default("unknown")) | lower %}
  {% if status_value == "published" %}
    <span class="inline-flex items-center rounded-full border border-emerald-200 bg-emerald-50 px-2 py-1 text-xs font-medium text-emerald-700">
      Published
    </span>
  {% elif status_value == "draft" %}
    <span class="inline-flex items-center rounded-full border border-amber-200 bg-amber-50 px-2 py-1 text-xs font-medium text-amber-700">
      Draft
    </span>
  {% else %}
    <span class="inline-flex items-center rounded-full border border-border bg-surface px-2 py-1 text-xs font-medium text-muted">
      {{ status | default("Unknown") }}
    </span>
  {% endif %}
{%- endmacro %}
