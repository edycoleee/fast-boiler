[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-boiler"
version = "0.1.0"
description = "FastAPI boilerplate with modular monolith architecture"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "sqlalchemy>=2.0.35",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "alembic>=1.14.0",
  "itsdangerous>=2.2.0",
  "python-dotenv>=1.0.1",
]

[tool.uvicorn]
factory = false
host = "127.0.0.1"
port = 8000

[tool.setuptools.packages.find]
include = ["app*"]
